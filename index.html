<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA Catering Cost Calculator | Los Angeles Catering Experts</title>
  <meta name="description" content="Get an instant catering quote for your Los Angeles event. Weddings, corporate events, private parties and taco bars. Estimate your cost per guest in seconds.">
  <link rel="stylesheet" href="/style.css">
  <link rel="canonical" href="https://losangelescateringexperts.com/">
  <style>
    :root {
      --primary: #c9933b;
      --dark: #1a1a1a;
      --light: #f9f9f9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f5f7;
      color: var(--dark);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      background: #fff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .result-box {
      background: #fdf8f0;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin: 20px 0;
    }
    .result-price {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--primary);
    }
    .disclaimer {
      font-size: 0.75rem;
      color: #777;
      margin-top: 6px;
    }
    button {
      width: 100%;
      background: var(--dark);
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
  </style>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://losangelescateringexperts.com/#website",
      "name": "Los Angeles Catering Experts",
      "url": "https://losangelescateringexperts.com/",
      "description": "Explore catering information and estimate event catering costs in Los Angeles, California.",
      "inLanguage": "en-US"
    },
    {
      "@type": "WebApplication",
      "@id": "https://losangelescateringexperts.com/#estimator",
      "name": "Los Angeles Catering Cost Estimator",
      "url": "https://losangelescateringexperts.com/",
      "description": "A free online tool to estimate catering costs for weddings, corporate events, and private parties in Los Angeles.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "isPartOf": {
        "@id": "https://losangelescateringexperts.com/#website"
      }
    }
  ]
}
</script>

</head>
<body>
<nav class="topnav"><a href="/">Cost Calculator</a><a href="/companies">Catering Directory</a><a href="/add-business">List Your Business</a></nav>

<div class="container">
  <h1>LA Catering Estimator</h1>
  <p class="subtitle">Get an instant quote for your Los Angeles event</p>

  <div class="form-group">
    <label for="eventType">Event Type</label>
    <select id="eventType" onchange="calculate()">
      <option value="35">Corporate Event ($35/guest)</option>
      <option value="65">Wedding Reception ($65/guest)</option>
      <option value="45">Private Party ($45/guest)</option>
      <option value="25">Taco Bar / Casual ($25/guest)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" value="50" min="10" oninput="calculate()">
  </div>

  <div class="result-box">
    <div>Estimated Total:</div>
    <div class="result-price" id="totalPrice">$1,750</div>
    <div class="disclaimer">This is an estimate only. Final pricing depends on menu, location and services.</div>
  </div>

  <form action="https://formspree.io/f/xbldbeoo" method="POST">
    <input type="hidden" name="Estimate" id="hiddenEstimate" value="$1,750">
    <input type="hidden" name="Event_Type" id="hiddenType" value="Corporate Event ($35/guest)">
    <input type="hidden" name="Guests" id="hiddenGuests" value="50">
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="(310) 555-0199" required>
    </div>

    <button type="submit">Lock In Your Quote</button>
  </form>
  <p style="text-align:center;margin-top:18px;font-size:0.9rem"><a href="/companies">Browse Los Angeles catering companies</a></p>
</div>

<script>
  function calculate() {
    var sel = document.getElementById('eventType');
    var rate = parseFloat(sel.value);
    var guests = Math.max(10, parseInt(document.getElementById('guests').value, 10) || 10);
    var total = rate * guests;
    var formatted = '$' + total.toLocaleString('en-US');

    document.getElementById('totalPrice').innerText = formatted;
    document.getElementById('hiddenEstimate').value = formatted;
    document.getElementById('hiddenType').value = sel.options[sel.selectedIndex].text;
    document.getElementById('hiddenGuests').value = guests;
  }
  calculate();
</script>

</body>
</html>
